<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>FDownloader – Đang tải</title>
  <style>
    :root { --bg: #f0f2f5; --fg: #1c1e21; --muted: #65676b; --card: #fff; --bar: #e4e6eb; --accent: #1877f2; --err: #d93025; --ok: #1e8e3e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18191a; --fg: #e4e6eb; --muted: #b0b3b8; --card: #242526; --bar: #3a3b3c; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { width: min(560px, calc(100vw - 32px)); background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgb(0 0 0 / .1); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    #name { color: var(--muted); word-break: break-all; margin-bottom: 16px; }
    .track { margin-bottom: 12px; }
    .label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #msg { margin-top: 16px; font-weight: 600; }
    #msg.err { color: var(--err); }
    #msg.ok { color: var(--ok); }
  </style>
</head>
<body>
  <main>
    <h1>Đang tải video</h1>
    <div id="name"></div>
    <div id="tracks"></div>
    <div id="msg"></div>
  </main>
  <script src="mux.js"></script>
  <script src="download.js"></script>
</body>
</html>
